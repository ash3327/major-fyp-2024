<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hand Gesture Recognition</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  </head>
  <body>
    <div id="save-indicator"></div>
    <div class="container">
      <div class="row mb-3">
        <div class="col-12">
          <div class="alert alert-info">
            Current Model: <strong class="model-name">{{ model_name }}</strong>
          </div>
        </div>
      </div>
      <div class="row">
        <!-- Input Feed -->
        <div class="col-lg-6">
          <div class="card">
            <div class="card-header">Hand Gesture Recognition</div>
            <div class="card-body">
              <div class="controls-container">
                <button
                  id="toggle-mode"
                  class="btn btn-primary"
                  onclick="toggleMode()"
                >
                  Switch to Image
                </button>
                <button
                  id="toggle-alphabets"
                  class="btn btn-danger"
                  onclick="toggleAlphabets()"
                >
                  Disable Alphabets
                </button>
              </div>
              <div class="upload-container" id="upload-controls">
                <input
                  type="file"
                  id="image-upload"
                  accept="image/*"
                  class="form-control mb-2"
                />
                <button onclick="uploadImage()" class="btn btn-success w-100">
                  Process Image
                </button>
              </div>
              <div class="video-container">
                <div id="webcam-feed">
                  <img class="video-feed" src="{{ url_for('video_feed') }}" />
                </div>
                <div id="image-display" style="display: none">
                  <img id="uploaded-image" class="video-feed" src="" />
                </div>
              </div>
              <div id="predictionDisplay" class="mb-3">
                <h3 id="currentPrediction">No Gesture Detected</h3>
              </div>
              <div id="predictionRankings" class="mb-3">
                <!-- Prediction bars will be added here dynamically -->
              </div>
              <div id="prediction">Waiting for gesture...</div>
              <div class="alert alert-info mt-3">
                <small>Press spacebar to store the current gesture</small>
              </div>
            </div>
          </div>
        </div>

        <!-- Visualization and Stored Gestures -->
        <div class="col-lg-6">
          <div class="card mb-4">
            <div class="card-header">
              <ul class="nav nav-tabs card-header-tabs">
                <li class="nav-item">
                  <a
                    class="nav-link active"
                    onclick="showContent('pca')"
                    href="javascript:void(0);"
                    >Gesture Space Visualization</a
                  >
                </li>
                <li class="nav-item">
                  <a
                    class="nav-link"
                    onclick="showContent('reference')"
                    href="javascript:void(0);"
                    >Reference Image</a
                  >
                </li>
              </ul>
            </div>
            <div class="card-body">
              <div id="content">
                <div id="pca" class="content-pane">
                  <div id="pca-plot"></div>
                </div>
                <div id="reference" class="content-pane" style="display: none">
                  <img
                    src="static/image.png"
                    class="img-fluid"
                    alt="Reference Image"
                  />
                </div>
              </div>
            </div>
          </div>

          <script>
            function showContent(type) {
              // Hide all content panes
              const panes = document.querySelectorAll(".content-pane");
              panes.forEach((pane) => {
                pane.style.display = "none";
              });

              // Show the selected content pane
              document.getElementById(type).style.display = "block";
            }
          </script>

          <div class="card">
            <div class="card-header">Stored Gestures</div>
            <div class="card-body">
              <div id="stored-gestures"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
